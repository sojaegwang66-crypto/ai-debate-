<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 4인 토론 웹앱</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #4f46e5; }
        .box { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; height: 80px; }
        button { background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #4338ca; }
        .result-box { margin-top: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI 4인 토론 웹앱</h2>
        
        <div class="box">
            <label for="password">앱 비밀번호:</label>
            <input type="password" id="password" placeholder="비밀번호 입력 (예: 150413)">
        </div>

        <div class="box">
            <label for="prompt">토론 주제 입력:</label>
            <textarea id="prompt" placeholder="토론할 주제나 질문을 입력하세요.">인공지능이 인간의 일자리를 대체하는 것에 대해 어떻게 생각하시나요?</textarea>
        </div>

        <div class="box">
            <label for="modelSelect">참여할 AI 선택:</label>
            <select id="modelSelect">
                <option value="gemini">Gemini (Google)</option>
                <option value="openai">ChatGPT (OpenAI - 모의)</option>
                <option value="anthropic">Claude (Anthropic - 모의)</option>
                <option value="grok">Grok (xAI - 모의)</option>
            </select>
        </div>

        <button onclick="startDebate()">토론 시작하기</button>

        <div class="result-box" id="result">여기에 AI의 답변이 표시됩니다.</div>
    </div>

    <script>
        const WORKER_URL = "https://solitary-rain-d170.sojaegwang66.workers.dev";

        async function startDebate() {
            const password = document.getElementById("password").value;
            const prompt = document.getElementById("prompt").value;
            const model = document.getElementById("modelSelect").value;
            const resultDiv = document.getElementById("result");

            if (!password) {
                alert("앱 비밀번호를 입력해주세요!");
                return;
            }
            if (!prompt) {
                alert("토론 주제를 입력해주세요!");
                return;
            }

            resultDiv.innerText = "AI가 생각을 정리하고 있습니다... 잠시만 기다려주세요!";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-App-Password": password
                    },
                    body: JSON.stringify({ model, prompt })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerText = `[${model.toUpperCase()} 의견]\n\n` + data.result;
                } else {
                    resultDiv.innerText = "오류 발생: " + (data.error || "알 수 없는 오류");
                }
            } catch (err) {
                resultDiv.innerText = "서버 통신 실패: " + err.message;
            }
        }
    </script>
</body>
</html>
